name: Pre-release action-plugins - terraform

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
    paths:
      - "action-plugins/terraform/.version"
      - "action-plugins/terraform/**/*.go"

jobs:
  check-version:
    name: Check Pre-release Version
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Version is Pre-release
        id: check
        working-directory: action-plugins/terraform
        run: |
          VERSION=$(cat .version)
          if [[ "${VERSION}" =~ -(alpha|beta|rc|a|b) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-and-prerelease:
    name: Build and Pre-release terraform
    needs: check-version
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Plugin Version
        id: read_version
        working-directory: action-plugins/terraform
        run: |
          VERSION=$(cat .version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if Tag or Release Exists
        id: check-tag-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_EXISTS=$(git ls-remote --tags origin | grep "refs/tags/terraform-v${{ steps.read_version.outputs.version }}" || true)
          RELEASE_EXISTS=$(gh release list --repo ${{ github.repository }} | grep "Release terraform v${{ steps.read_version.outputs.version }}" || true)
          if [ -n "${TAG_EXISTS}" ] || [ -n "${RELEASE_EXISTS}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build Plugin
        if: steps.check-tag-release.outputs.skip == 'false'
        working-directory: action-plugins/terraform
        run: |
          # Build for multiple platforms
          for os in darwin linux; do
            for arch in amd64 arm64; do
              # Only build darwin-amd64, darwin-arm64, and linux-amd64
              if [ "$os" = "darwin" ] && ([[ "$arch" = "amd64" ]] || [[ "$arch" = "arm64" ]]); then
                GOOS=${os} GOARCH=${arch} go build -o terraform-v${{ steps.read_version.outputs.version }}-${os}-${arch}
              elif [ "$os" = "linux" ] && [ "$arch" = "amd64" ]; then
                GOOS=${os} GOARCH=${arch} go build -o terraform-v${{ steps.read_version.outputs.version }}-${os}-${arch}
              fi
            done
          done

      - name: Create Version Tag
        if: steps.check-tag-release.outputs.skip == 'false'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: terraform-v${{ steps.read_version.outputs.version }}
          tag_prefix: ''

      - name: Create Pre-release
        if: steps.check-tag-release.outputs.skip == 'false'
        id: create_prerelease
        uses: ncipollo/release-action@v1
        with:
          name: Pre-release terraform v${{ steps.read_version.outputs.version }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          artifacts: action-plugins/terraform/terraform-v${{ steps.read_version.outputs.version }}-*
          skipIfReleaseExists: true
          generateReleaseNotes: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
