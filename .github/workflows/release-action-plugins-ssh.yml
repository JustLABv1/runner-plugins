name: Release action-plugins - ssh

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "action-plugins/ssh/.version"
      - "action-plugins/ssh/**/*.go"

jobs:
  build-and-release:
    name: Build and Release ssh
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Plugin Version
        id: read_version
        working-directory: action-plugins/ssh
        run: |
          VERSION=$(cat .version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if Tag or Release Exists
        id: check-tag-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_EXISTS=$(git ls-remote --tags origin | grep "refs/tags/ssh-v${{ steps.read_version.outputs.version }}" || true)
          RELEASE_EXISTS=$(gh release list --repo ${{ github.repository }} | grep "Release ssh v${{ steps.read_version.outputs.version }}" || true)
          if [ -n "${TAG_EXISTS}" ] || [ -n "${RELEASE_EXISTS}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build Plugin
        if: steps.check-tag-release.outputs.skip == 'false'
        working-directory: action-plugins/ssh
        run: |
          # Build versioned binaries
          for os in darwin linux; do
            for arch in amd64 arm64 386 arm ppc64le s390x; do
              GOOS=${os} GOARCH=${arch} go build -o ssh-v${{ steps.read_version.outputs.version }}-${os}-${arch}
            done
          done
          
          # Build latest binaries
          for os in darwin linux; do
            for arch in amd64 arm64 386 arm ppc64le s390x; do
              GOOS=${os} GOARCH=${arch} go build -o ssh-latest-${os}-${arch}
            done
          done

      - name: Create Version Tag
        if: steps.check-tag-release.outputs.skip == 'false'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ssh-v${{ steps.read_version.outputs.version }}
          tag_prefix: ''
      
      - name: Update Latest Tag
        if: steps.check-tag-release.outputs.skip == 'false'
        run: |
          set -e
          # Delete local and remote -latest tag if it exists
          git tag -d ssh-latest 2>/dev/null || true
          git push origin :refs/tags/ssh-latest 2>/dev/null || true
          # Create new -latest tag at current commit
          git tag ssh-latest
          git push origin ssh-latest --force

      - name: Create Version Release
        if: steps.check-tag-release.outputs.skip == 'false'
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          name: Release ssh v${{ steps.read_version.outputs.version }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          artifacts: action-plugins/ssh/ssh-v${{ steps.read_version.outputs.version }}-*
          skipIfReleaseExists: true
          generateReleaseNotes: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Latest Release
        if: steps.check-tag-release.outputs.skip == 'false'
        id: create_latest_release
        uses: ncipollo/release-action@v1
        with:
          name: Release ssh latest
          tag: ssh-latest
          artifacts: action-plugins/ssh/ssh-latest-*
          skipIfReleaseExists: false
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
