name: Pre-release action-plugins - ping

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
    paths:
      - "action-plugins/ping/.version"
      - "action-plugins/ping/**/*.go"

jobs:
  check-version:
    name: Check Pre-release Version
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Version is Pre-release
        id: check
        working-directory: action-plugins/ping
        run: |
          VERSION=$(cat .version)
          if [[ "${VERSION}" =~ -(alpha|beta|rc|a|b) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-and-prerelease:
    name: Build and Pre-release ping
    needs: check-version
    if: needs.check-version.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Plugin Version
        id: read_version
        working-directory: action-plugins/ping
        run: |
          VERSION=$(cat .version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if Tag or Release Exists
        id: check-tag-release
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          TAG_EXISTS=$(git ls-remote --tags origin | grep "refs/tags/ping-v${{ steps.read_version.outputs.version }}" || true)
          RELEASE_EXISTS=$(gh release list --repo ${{ github.repository }} | grep "Release ping v${{ steps.read_version.outputs.version }}" || true)
          if [ -n "${TAG_EXISTS}" ] || [ -n "${RELEASE_EXISTS}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build Plugin
        if: steps.check-tag-release.outputs.skip == 'false'
        working-directory: action-plugins/ping
        run: |
          # Build for multiple platforms
          for os in darwin linux; do
            for arch in amd64 arm64; do
              GOOS=${os} GOARCH=${arch} go build -o ping-v${{ steps.read_version.outputs.version }}-${os}-${arch}
            done
          done

      - name: Create Version Tag
        if: steps.check-tag-release.outputs.skip == 'false'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          custom_tag: ping-v${{ steps.read_version.outputs.version }}
          tag_prefix: ''

      - name: Create Pre-release
        if: steps.check-tag-release.outputs.skip == 'false'
        id: create_prerelease
        uses: ncipollo/release-action@v1
        with:
          name: Pre-release ping v${{ steps.read_version.outputs.version }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          artifacts: action-plugins/ping/ping-v${{ steps.read_version.outputs.version }}-*
          skipIfReleaseExists: true
          generateReleaseNotes: true
          prerelease: true
          token: ${{ secrets.ACCESS_TOKEN }}
